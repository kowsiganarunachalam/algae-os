flush ruleset

table inet algae {
	set app_outbound {
		type uid
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iifname "lo" accept
		ct state established,related accept
		meta l4proto udp udp sport 67 udp dport 68 accept
		meta l4proto udp udp sport 547 udp dport 546 accept
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
	}

	chain output {
		type filter hook output priority filter; policy drop;

		oifname "lo" accept
		ct state established,related accept
		meta skuid @app_outbound accept
		meta skuid 0 udp dport 67 accept
		meta skuid 0 udp dport 547 accept
		meta skuid 0 udp dport 53 accept
		meta skuid 0 tcp dport 53 accept
		include "/etc/algae/network-permissions.nft"
	}
}
