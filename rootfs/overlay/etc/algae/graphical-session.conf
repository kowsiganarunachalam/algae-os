# Select the Wayland compositor independently of Algae Home.
# Args are whitespace-separated and must match the selected compositor.
ALGAE_COMPOSITOR_BIN=/usr/bin/weston
ALGAE_COMPOSITOR_ARGS=--backend=drm-backend.so --idle-time=0 --socket=wayland-0
ALGAE_WAYLAND_DISPLAY=wayland-0
ALGAE_XDG_RUNTIME_DIR=/run/algae
